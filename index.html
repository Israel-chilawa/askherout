<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cinderella 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .love-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .love-card h2 {
      color: #e63946;
      font-weight: bold;
    }

    .heart {
      font-size: 40px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="love-card">
    <div class="heart">❤️</div>
    <h2 class="mb-3">Hello! Cinderella</h2>
    <p class="text-muted">
      How old are you? 💫
    </p>

    <div class="mb-3">
      <input
        type="number"
        id="ageInput"
        class="form-control form-control-lg text-center"
        placeholder="Enter your age"
      >
    </div>

    <button
      class="btn btn-danger btn-lg w-100"
      onclick="checkAge()"
    >
      Check 💌
    </button>

    <p id="result" class="mt-4 fw-semibold"></p>
  </div>

  <script>
    function checkAge() {
      const age = document.getElementById("ageInput").value;
      const result = document.getElementById("result");

      if (age === "") {
        result.innerHTML = "Please enter your age 😊";
        result.style.color = "#555";
      } else if (age >= 18) {
        result.innerHTML =
          "You are an adult 💕<br>Would you like to go out for a coffee sometime? ☕✨";
        result.style.color = "#e63946";
      } else {
        result.innerHTML =
          "You are  young 🌱<br>Focus on your dreams, growth, and future ✨";
        result.style.color = "#457b9d";
      }
    }
  </script>

</body>
</html>
