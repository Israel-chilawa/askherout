<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hope Dennis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    /* Mobile-first */
    body {
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .love-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .heart {
      font-size: 36px;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Tablet and up */
    @media (min-width: 768px) {
      .love-card {
        padding: 32px;
        max-width: 420px;
      }

      .heart {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="love-card">
    <div class="heart mb-2">❤️</div>

    <h4 class="fw-bold text-danger mb-2">
      Hello Hope Dennis
    </h4>

    <p class="text-muted small mb-3">
      let check your age and get your feedback 💫
    </p>

    <input
      type="number"
      id="ageInput"
      class="form-control form-control-lg text-center mb-3"
      placeholder="Enter your age"
    >

    <button
      class="btn btn-danger btn-lg w-100"
      onclick="checkAge()"
    >
      Check 💌
    </button>

    <p
      id="result"
      class="mt-4 fw-semibold small"
    ></p>
  </div>

  <script>
    function checkAge() {
      const age = document.getElementById("ageInput").value;
      const result = document.getElementById("result");

      if (!age) {
        result.innerHTML = "Please enter your age 😊";
        result.style.color = "#555";
      } else if (age >= 18) {
        result.innerHTML =
          "You are an adult 💕<br>Would you like to go out for a coffee sometime? ☕✨";
        result.style.color = "#e63946";
      } else {
        result.innerHTML =
          "You are  young 🌱<br>Focus on your dreams and future ✨";
        result.style.color = "#457b9d";
      }
    }
  </script>

</body>
</html>
